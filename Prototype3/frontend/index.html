<!DOCTYPE html>
<!-- Main UI layout for model controls, prediction output, and map highlight. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype3 Accent Mapper</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
  <div class="container py-4 py-lg-5">
    <header class="mb-4">
      <h1 class="h2 mb-2">Prototype3 - Plug-and-Play Accent Mapper</h1>
      <p class="text-body-secondary mb-0">
        Select a model, record audio, upload audio, and view the prediction.
      </p>
    </header>

    <main class="row g-4">
      <section class="col-12 col-lg-4">
        <div class="card shadow-sm h-100 border-0">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Controls</h2>

            <label for="modelSelect" class="form-label">Model</label>
            <select id="modelSelect" class="form-select">
              <option>Loading models...</option>
            </select>

            <div class="d-flex gap-2 my-3">
              <button id="recordBtn" class="btn btn-outline-primary w-100">
                Start Recording
              </button>
              <button id="stopBtn" class="btn btn-outline-secondary w-100" disabled>
                Stop Recording
              </button>
            </div>
            <div id="recordingCountdown" class="form-text mb-3">
              Minimum 10 seconds
            </div>

            <label for="audioFile" class="form-label">Upload audio file</label>
            <input
              id="audioFile"
              class="form-control"
              type="file"
              accept=".wav,.mp3,.m4a,.ogg,.flac,audio/*"
            />

            <audio id="audioPlayback" class="w-100 my-3" controls></audio>

            <button id="predictBtn" class="btn btn-secondary w-100" disabled>
              Predict Accent
            </button>

            <div id="statusMessage" class="alert alert-secondary mt-3 mb-0 py-2">
              Loading...
            </div>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-4">
        <div class="card shadow-sm h-100 border-0">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Prediction</h2>
            <p class="mb-2"><strong>Model:</strong> <span id="resultModel">-</span></p>
            <p class="mb-2"><strong>Prediction:</strong> <span id="resultLabel">-</span></p>
            <p class="mb-3"><strong>Confidence:</strong> <span id="resultConfidence">-</span></p>

            <h3 class="h6 text-uppercase text-body-secondary mb-2">Class Probabilities</h3>
            <ul id="probList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-4">
        <div class="card shadow-sm h-100 border-0">
          <div class="card-body">
            <h2 class="h5 card-title">Map</h2>
            <div id="map" class="map-box"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
